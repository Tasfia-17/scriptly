name: scriptly
description: "AI-powered storytelling app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^14.2.7
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  http: ^1.2.2
  serverpod_flutter: ^2.0.0
  serverpod_auth_client: ^2.0.0
  scriptly_client:
    path: ../scriptly_client

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
